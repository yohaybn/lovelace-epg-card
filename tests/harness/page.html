<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --primary-color: #03a9f4;
    --text-primary-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --card-background-color: #ffffff;
    --secondary-background-color: #f0f2f5;
    --divider-color: #e0e0e0;
    --error-color: #db4437;
    --warning-color: #f4b400;
    --ha-card-border-radius: 12px;
  }
  html.dark {
    --primary-color: #4fc3f7;
    --text-primary-color: #0d1b24;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1c1e;
    --secondary-background-color: #2c2c2e;
    --divider-color: #3a3a3c;
  }
  body {
    margin: 0;
    padding: 20px;
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
    background: var(--secondary-background-color);
  }
  html.dark body { background: #111; }
  .wrap { max-width: 960px; margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap"><epg-card id="card"></epg-card></div>
<script src="./stubs.js"></script>
<script src="./mock-hass.js"></script>
<script src="../../dist/epg-card.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const scenario = params.get("scenario") || "desktop-light";
  if (scenario.includes("dark")) document.documentElement.classList.add("dark");
  if (scenario.includes("rtl")) {
    document.documentElement.dir = "rtl";
    document.documentElement.lang = "he";
  }
  const card = document.getElementById("card");
  const variant = scenario.includes("rtl") ? "rtl" : "default";
  const hass = window.mockHass(variant);

  let entities;
  if (scenario === "state-error") {
    entities = ["sensor.epg_missing_one", "sensor.epg_missing_two"];
  } else if (scenario === "state-loading") {
    entities = ["sensor.epg_bbc_one"];
    card._forceLoading = true;
  } else if (scenario === "state-partial") {
    entities = ["sensor.epg_bbc_one", "sensor.epg_missing_one", "sensor.epg_arte"];
  } else {
    entities = Object.keys(hass.states);
  }
  card.setConfig({ entities, row_height: 84, title: "TV Guide" });

  if (scenario === "state-loading") {
    // Freeze the loading grace window by feeding an empty states map.
    card.hass = { states: {} };
  } else {
    card.hass = hass;
  }
  if (scenario === "tooltip") {
    setTimeout(() => {
      const program = card.shadowRoot.querySelectorAll(".program")[2];
      program.dispatchEvent(new MouseEvent("mouseover", { bubbles: true, composed: true }));
    }, 300);
  }
  // Serialize the shadow DOM into light DOM so headless --dump-dom can see it.
  function dumpShadow() {
    let dump = document.getElementById("dump");
    if (!dump) {
      dump = document.createElement("div");
      dump.id = "dump";
      dump.style.display = "none";
      document.body.appendChild(dump);
    }
    dump.textContent = card.shadowRoot ? card.shadowRoot.innerHTML : "";
  }
  setInterval(dumpShadow, 200);
  window.__rendered = true;
})();
</script>
</body>
</html>
